.,English
quest.name,TheBeginningoftheEnd
quest.synopsys,Tipped off by a friend, you find yourself at a mansion, where a cult ritual is 'happening'.
quest.description,"This is for Mansions of Madness Second Edition. \n\nTipped off by a friend, you find yourself walking into someones front yard, looking for a so called 'cult ritual' that is supposedly going to take place. With no other choice but to keep investigating you press onward, hoping against all odds that you will make it out alive."
quest.authors,"FirstTimer\nValkryie\nMansion of Madness "
quest.authors_short,FirstTimer
EventStart.button1,Continue
Tokenplaceinvestigatores.text,You walk up to the building feeling calm, knowing that you can face anything that comes. Place your investigators as indicated. 
EventStart.text,You arrive at the front of the mansion. The overgrown hedge crowds around you, making it hard to breathe. A fire pit, still smoldering, reeks of rotting fish. And the door ahead of you has been left slightly ajar. Place the Yard 2 tile as indicated.
TokenSearchtokenyard2.button1,{action} Search
Eventtoken.text,You notic that the fire is still smoldering. Place a search token as indicated.
Eventtoken.button1,Continue
Eventexploreyard2.button1,Continue
Eventexploreyard2.text,The door right in front of you has been left slightly ajar. Place an explore token as indicated.
Eventplaceinvestigators.text,You walk up to the building feeling calm, knowing that you can face anything that comes. Place your investigators as indicated. 
Eventplaceinvestigators.button1,Continue
TokenSearchtokenyard2.text,You notice the still smoldering fire reeks like fish.
EventSearchTokenYard2.text,The smell of fish leads you to the spine of a book. Someone was burning information. Gain 2 Clues and discard this search token.
EventSearchTokenYard2.button1,Continue
Tokendooryard2.text,Through the crack in the door you think you can see the inside of a hall.
Tokendooryard2.button1,{action} Explore
EventPlacetheentryhalltile.text,You step into a lavish entry hall. Place the Entry Hall tile and wall  as indicated. Then discard this explore token.
EventPlacetheentryhalltile.button1,Continue
EventExploreTokenLeftEntryHall.text,You notice a door leading off to the left. Place an explore token as indicated.
EventExploreTokenLeftEntryHall.button1,Continue
EventDOORSrightEntryHall.text,To your right, you notice two doors, one leading down, the other leading to a billiards room.
EventDOORSrightEntryHall.button1,Continue
EventSightTOken.text,The hall continues to the right. Place a sight token as indicated.
EventSightTOken.button1,Continue
EventSearchtokenentryhall.button1,Continue
EventMoveonespaceintotheentryhall.text,You may move one space into the explored area.
EventMoveonespaceintotheentryhall.button1,Continue
EventSearchtokenentryhall.text,You notice an old musty book lying on the desk. Place a search token as indicated.
TokenOLDJOURNAL.text,You noticed an old book on the desk.
EventBeginreadingoldjournal.text,You can read the old journal as an action.
EventOldJournal.text,You pick up the book, gain the Old Journal Unique Item, then discard this search token. An investigator holding the Old Journal can read it as an action using the app.
EventOldJournal.button1,Continue
TokenOLDJOURNAL.button1,{action} Search
EventBeginreadingoldjournal.button1,{action} Read
EventReadoldjournal.text,"I found it. After 20 years of searching, I finally found all the ritual parts. I just need more power. A blood sacrifice. Maybe a human blood sacrifice. I can't wait. Gain 2 Clues and the Circumstantial Evidence Unique Item.\nThe date was only two weeks ago."
EventReadoldjournal.button1,Continue
EventBeginreadingoldjournal.button2,Back
Eventmoreentrees.text,There is still more to read.
Eventmoreentrees.button1,{action} Read
Eventmoreentrees.button2,Back
EventReadoldjournal2.text,"I did it. I have begun to summon the doom of Arkham-and the world-I only need 24 hours for the ritual to complete itself. The blood sacrfice was easy, I just don't know how I'm going to get the stains out of the basement. It was only one life out of many that will befall Arkham in the next 48 hours. 2:30p.m. \nThat was 24 hours  ago! Gain 2 clues and suffer 2 facedown horror. Test {will} to negate."
EventReadoldjournal2.button1,Continue
TokenSightTOken.text,You can peek around the end of the hall. An investigator in the Entry Hall may look around the corner.
TokenSightTOken.button1,Look
Eventrevealrestofhall.text,You look around the rest of the hall. Place the Bathroom, Hall End tile, and wall as indcated. Then discard this sight token.
Eventrevealrestofhall.button1,Continue
EventBEDROOM.text,There is a door off to your left. Place an explore token as indicated.
EventBEDROOM.button1,Continue
Eventbathroom.button1,Continue
Eventconservatory.text,There are a few key holes in this door. Place an explore token as indicated.
Eventbathroom.text,There is a bathroom at the end of the hall. Place an explore token as indicated.
Eventconservatory.button1,Continue
Eventsearchtoken.text,There is a family tree picture here. Place a search token as indicated.
Eventsearchtoken.button1,Continue
TokenBasementExploreTOken.button1,{action} Explore
TokenBasementExploreTOken.text,This door leads down to the basement.
EventBasement.text,You open the door to the stench of dried blood. The cold air that drifts to you unsettles you. Place the Basement and Walls as indicated.
EventBasement.button1,Continue
EventSearchtoken.text,You look around, there is a dried corpse on the ground, surrounded in dried blood. Suffer 1 facedown Horror, then place a search token as indicated.
EventSearchtoken.button1,Continue
SpawnSpawn_Deep_One.button1,Continue
SpawnSpawn_Deep_One.text,You here sniffing, and something grotesque steps into the light. Spawn a Deep One as indicated.
TokenBilliardsroomExplore.text,This door leads to a billiards room.
TokenBilliardsroomExplore.button1,{action} Explore
EventBilliardsroom.text,You open the door to find a very ordinary looking billiards room. Place the Billiards Room Tile as indicated. Then discard the Explore Token.
EventBilliardsroom.button1,Continue
EventSearchTOken.text,There is a small box with something strange inside. Place a search token as indicated.
EventSearchTOken.button1,Continue
Eventelder.text,Some of the pool balls look strange. Place a Search Token as indicated.
Eventelder.button1,Continue
TokenPhotograph.text,There is a picture of the family tree.
TokenPhotograph.button1,{action} Search
EventPhotograph.text,You search for anything useful {observation} 2.
EventPhotograph.button1,Pass
EventPhotograph.button2,Fail
EventFAIL.text,Try though you might, you don't notice anything.
EventFAIL.button1,Continue
Eventpass.text,You follow the tree down to the most recent proprietor of the mansion. The name is Fred Cooper, gain the Photographic Evidence Unique Item and 2 Clues, then discard this Search Token.
Eventpass.button1,Continue
TokenGrotesqueStone.text,The strange box you noticed has something inside of it.
TokenGrotesqueStone.button1,{action} Search
EventPuzzle1.text,You notice a lock, maybe you can crack it. Solve using {observation}.
EventPuzzle1.button1,Continue
Puzzle0.button1,Guess
EventSOlve.text,You slide open the box to find a tome, gain the Grotesque Stone Unique Item. You look for more, and find a note that says: To Fred, here is your statue, I figured you would want to see it. Gain 2 Clues, then discard this search token.
EventSOlve.button1,Continue
TokenElderWard.text,You noticed that not all the pool balls are pool balls.
TokenElderWard.button1,{action} Search
Eventelder0.button1,Continue
TokenExploreTokenStudy.text,This door leads off to the left.
Eventelder0.text,You pick up the wonky looking pool ball, gain the Elder Ward Common Item, then discard this search token.
TokenExploreTokenStudy.button1,{action} Search
Event0.text,You open the door to what appears to be a study. Place the Study Tile and Wall Token as indicated. Then discard this explore token.
Event0.button1,Continue
Event1.text,There is a desk with a few drawers in it. Place a Search Token as indicated.
Event1.button1,Continue
Event2.text,There is a bookshelf by the wall, but also a keyhole. Place a Search Token as indicated.
Event2.button1,Continue
TokenFire.text,You notice a bunch of drawers in the desk.
TokenFire.button1,{action} Search
Event3.text,You open all the drawers but find nothing of use to the investigation, but you do find a fancy fire extinguisher by the desk. Gain the Fire Extinguisher Common Item, then discard this Search Token.
Event3.button1,Continue
TokenRitual.text,The dead body lies on the floor, withered.
TokenRitual.button1,{action} Search
Event4.text,You start examining for clues and what happened. Test {lore} 3. 
Event4.button1,Pass
Event4.button2,Fail
Event5.text,You can't tell what that scrap of wax is there for.
Event5.button1,Continue
Event6.text,It all clicks in your head. The murderer used a spell to wither the person, taking the blood, and feeding it to some greater ritual. Gain the Wither Spell and the Candles Common Item. Then discard this search token.
Event6.button1,Continue
TokenExploreTokenBedroom.text,This door leads to a Bedroom.
TokenExploreTokenBedroom.button1,{action} Explore
Event7.text,You open the door and step into a musty bedroom. Place the Bedroom 1 tile as indicated. Then discard this explore token.
Event7.button1,Continue
Event8.text,There is a bedside table. Place a search token as indicated.
Event8.button1,Continue
TokenGun.text,You noticed a bedside table.
TokenGun.button1,{action} Search
Event9.text,You open the drawer to find a gun. Gain the .18 Derringer Common Item, then discard this Search token.
Event9.button1,Continue
Event10.text,A search is never complete without looking under the bed. Place a Search Token as indicated.
Event10.button1,Continue
TokenHidden.text,A search is never complete without a look under the bed.
TokenHidden.button1,{action} Search
Event11.text,You peak under the bed and notice a latch. An investigator can attempt to pick the lock testing {agility}.
Event11.button1,Continue
Puzzle1.button1,Guess
Event12.text,You unlock the latch and pull, revealing a passage. Place a Secret Passage Token as indicated, then discard this Search Token.
Event12.button1,Continue
Event13.text,You follow the passage for what feels like hours. And then you pop up in a completely different part of the mansion. Place the Bell Tower and Wall token as indicated.
Event13.button1,Continue
Event14.text,You catch a glint of metal from the bell, place a Search Token as indicated.
Event14.button1,Continue
Token8.text,You caught a glimpse of metal comming up from the passage.
Token8.button1,{action} Search
Event15.text,You examine the bell, {observation} 3.
Event15.button1,Pass
Event15.button2,Fail
Event16.text,You can't figure out were the glint is coming from.
Event16.button1,Continue
Event17.text,You find the source of the glint. Gain the Gold Key Unique Item and the Carbine Rifle. Then discard this Search Token.
Event17.button1,Continue
Event18.button1,Continue
Event18.text,Place a Secret Passage as indicated. Then move your investigator to this place.
TokenExploreconservatory.text,This door is locked. You can only explore this if you have the Gold Key and the Silver Key.
TokenExploreconservatory.button1,{action} Explore
TokenBathrrom.text,This door leads into a bathroom
TokenBathrrom.button1,{action} Explore
Event19.text,You open the door to find a very ordinary bathroom. Discard this explore token.
Event19.button1,Continue
Event20.text,You notice a cabinet with a few useful things in it. Place a Search Token as indicated.
Event20.button1,Continue
Event21.text,You may move one space into the explored area.
Event21.button1,Continue
Token12.text,You examine the cabinet.
Token12.button1,{action} Search
Event22.text,You decide to open the drawer. Gain the Holy Water and Bandages Common Items. Then discard this Search Token.
Event22.button1,Continue
TokenlockBrasskey.text,This door is locked. You can only search it if you have the Brass Key.
TokenlockBrasskey.button1,{action} Search
Event23.text,You unlock the secret door. Remove this Search and Wall token. Then place the Office and Wall token as indicated.
Event23.button1,Continue
Event24.text,You notice a looming desk. Place a search token as indicated.
Event24.button1,Continue
Event25.text,You may move one space into the explored area.
Event25.button1,Continue
Token10.text,You look at the table.
Token10.button1,{action} Search
Event26.text,You examine the desk, looking for anything useful. {influence}  2.
Event26.button1,Pass
Event26.button2,Fail
Event27.text,Nothing seems of interest.
Event27.button1,Continue
Event28.text,You notice a key and a firearm. Gain the .45 Automatic Common Item and the Silver Key Unique Item, then discard this Search Token.
Event28.button1,Continue
Tokenlibrary.button1,{action} Explore
Tokenlibrary.text,This door leads off to the East side of the mansion.
Event29.text,You open the door and find yourself in an old library. Place the Library Tile and Wall and Door Token as indicated. Then discard this explore token.
Event29.button1,Continue
Event30.text,There is a discarded item on the floor. Place the Lead Pipe Common Item as indicated.
Event30.button1,Continue
Event31.text,There are a lot of books in the Library. Perhaps one could help you.
Event31.button1,Continue
Event32.text,You may move one space into the explored area.
Event32.button1,Continue
Token13.text,There are a lot of books in this Library. Perhaps one could help you.
Token13.button1,{action} Search
Event33.text,You look around for a while. {observation} 2.
Event33.button1,Pass
Event33.button2,Fail
Event34.text,There is nothing of use in this Library. Discard this Search Token.
Event34.button1,Continue
Event35.text,You look around for a while, and find something you can use. Gain the King James Bible Common Item, then discard this Search Token.
Event35.button1,Continue
Event36.text,A door leads south. Place an Explore Token as indicated.
Event36.button1,Continue
TokenDoortoballroom.text,This door leads to the south.
TokenDoortoballroom.button1,{action} Explore
Event37.text,You open the door and step into a beautiful ballroom. Place the Ballroom Tile and Wall Token as indicated. Then discard this Explore Token.
Event37.button1,Continue
Event38.text,You notice a Grand Piano in the corner of the room. Place a Search Token as indicated.
Event38.button1,Continue
Event39.text,There is a pot of plants in the corner. Place a Search Token as indicated.
Event39.button1,Continue
Event40.text,You may move one space into the explored area.
Event40.button1,Continue
Token15.text,The pot of plants has a weird mound in it.
Token15.button1,{action} Search
Event41.text,You examine the mound, and then decide to move it around. {will} 2.
Event41.button1,Pass
Event41.button2,Fail
Event42.text,You can't do it. You erach back and turn and run. Move one space away from this Search Token
Event42.button1,Continue
Event43.text,You reach your hand and find a slip of paper. It reads: 'in case you need an extra boost' -Fred. Gain the Feed the Mind Spell, then discard this Search Token.
Event43.button1,Continue
Token14.text,You noticed a piano in the corner of the room.
Token14.button1,{action} Search
Event44.text,You lift the lid and find a intricate design. An investigator can attempt the puzzle testing {observation}
Event44.button1,Continue
Puzzle2.button1,Guess
Event45.text,With a click, the thing slides open and a key pops out. Gain the Brass Key Unique Item, then discard this Search Token.
Event45.button1,Continue
Event46.text,You unlock the door and walk into the conservatory. Place the Conservatory Tile as indicated. Then discard this Explore Token.
Event46.button1,Continue
Event47.text,|||A man turns around and looks at you, and then laughs. "You are too late! The summoning is complete. With my power and knowledge helping the beast, you will never stop us!" He laughs again. |||
Event47.button1,Continue
Event48.text,You look out the window and see an even worse sight. 
Event48.button1,Continue
Event49.text,You may move one space into the explored area.
Event49.button1,Continue
Event50.text,You strike again and again, and eventually prevale. The form of the Star Spawn crumbles beneath your blows, and eventually hits the ground, dead. Though you didn't find enough evidence to convict the cult, you know what they are up to and plan to watch them from here on out. You leave the scene of the mansion and make your trek back home. The investigation is complete.
Event50.button1,Continue
SpawnPriest_of_Dagon.text,He turns back to the outside of the conservatory, Spawn a Priest of Dagon as indicated.
SpawnPriest_of_Dagon.button1,Continue
Spawn0.text,You notice a very huge, ominous form out the window. Spawn a Star Spawn as indicated.
Spawn0.button1,Continue
Spawn1.text,A cultist is chanting, seemingly in a daze. Spawn a cultist as indicated.
Spawn1.button1,Continue
Spawn2.text,The other cultist has stopped its chanting, turning its eyes on you. Spawn a cultist as indicated.
Spawn2.button1,Continue
Event51.text,You suspect that this leads to the rest of the building. Place an explore token as indicated.
Event51.button1,Continue
Event52.text,There is a family tree here. Place a search token as indicated.
Event52.button1,Continue
Event53.text,Try as you might, you run out of time, and the roars of a Star Spawn come across your mind. Then, it comes crashing through the mansion utterly destroying everything in its path. Fred Cooper, following behind, laughs at you. The investigation is not complete.
Event53.button1,Continue
Event54.text,Try as you might, you run out of time, and the roars of a Star Spawn come across your mind. Then, it comes crashing through the mansion utterly destroying everything in its path. Fred Cooper, following behind, laughs at you. The investigation is not complete.
Event54.button1,Continue
Event55.text,Try as you might, you run out of time, and the roars of a Star Spawn come across your mind. Then, it comes crashing through the mansion utterly destroying everything in its path. Fred Cooper, following behind, laughs at you. The investigation is not complete.
Event55.button1,Continue
Event56.text,Try as you might, you run out of time, and the roars of a Star Spawn come across your mind. Then, it comes crashing through the mansion utterly destroying everything in its path. Fred Cooper, following behind, laughs at you. The investigation is not complete.
Event56.button1,Continue
Event57.text,You may move one space into the explored area.
Event57.button1,Continue
Event58.text,Each investigator begins the game with 2 Clues.
Event58.button1,Continue